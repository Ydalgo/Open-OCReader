# ==============================================================================
# Docker Compose - Open OCReader Server (+ Proxy TLS 1.3 opcional)
# Uso básico:
#   docker compose up -d --build
# Uso con Nginx TLS 1.3 (perfil tls, tras colocar certificados en ./deploy/certs):
#   docker compose --profile tls up -d --build
# ==============================================================================
services:
  open-ocreader-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-ocreader-server
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${OPEN_OCREADER_PORT:-8000}:8000"
    environment:
      - OPEN_OCREADER_HOST=0.0.0.0
      - OPEN_OCREADER_PORT=8000
      - OPEN_OCREADER_API_KEY=${OPEN_OCREADER_API_KEY:-}
      - OPEN_OCREADER_TRUST_PROXY=${OPEN_OCREADER_TRUST_PROXY:-1}
      - OPEN_OCREADER_CORS_ORIGINS=${OPEN_OCREADER_CORS_ORIGINS:-http://localhost:8000}
      - OPEN_OCREADER_RATE_LIMIT=${OPEN_OCREADER_RATE_LIMIT:-30}
      - OPEN_OCREADER_DISABLE_PDF_TOOLS=${OPEN_OCREADER_DISABLE_PDF_TOOLS:-0}
      - HF_HUB_DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
    volumes:
      - ./models:/app/models
      - ./bin:/app/bin
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./config:/app/config
    # Para GPU Vulkan/Intel/AMD en host Linux, descomenta:
    # devices:
    #   - /dev/dri:/dev/dri
    mem_limit: ${OCREADER_MEM_LIMIT:-8g}

  nginx-tls13:
    image: nginx:1.27-alpine
    container_name: open-ocreader-nginx
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - open-ocreader-server
    security_opt:
      - no-new-privileges:true
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./deploy/nginx_docker_tls13.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/ssl/custom:ro
