# ==============================================================================
# Plantilla de Proxy Inverso Nginx con TLS 1.3 (Alineado con CCN-STIC-807 / ENS)
# para desplegar Open OCReader API Server en producción corporativa o AAPP.
# ==============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ocr.tu-organizacion.es;

    # Certificados TLS oficiales
    ssl_certificate     /etc/ssl/certs/open_ocreader.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/open_ocreader.key;

    # Cifrado estricto TLS 1.3 exclusivo (CCN-STIC-807)
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:OCRSSL:10m;
    ssl_session_tickets off;

    # Cabeceras de seguridad (HSTS, Anti-Clickjacking, Anti-Sniffing)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Límite coherente con el máximo de Open OCReader (100 MB)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos amplios para documentos largos o inferencia IA local
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ocr.tu-organizacion.es;
    return 301 https://$host$request_uri;
}
